plugins:
  relay_rooms_enabled:
    # Defaults to true so the page works immediately after install. This plugin
    # only reads a public API and renders it: no writes, no DB tables, no
    # background jobs, so there is nothing to opt into. discourse-solved defaults
    # its own enabled setting to true for the same reason.
    #
    # Note this default only applies while no value has been stored. If the
    # setting has ever been toggled, the stored value wins — check
    # /admin/site_settings/category/plugins if the page still does not appear.
    default: true
    client: true
  relay_rooms_api_url:
    default: "http://101.43.41.22:46784/relay/rooms"
    client: false
  relay_rooms_refresh_seconds:
    default: 30
    min: 5
    max: 600
    client: true
  relay_rooms_show_ingame:
    default: true
    client: true
  relay_rooms_join_link_scheme:
    default: "raw"
    type: enum
    choices:
      - "raw"
      - "cnkd"
    client: true
  relay_rooms_http_timeout:
    default: 8
    min: 2
    max: 30
    client: false
  relay_rooms_request_timeout_ms:
    default: 10000
    min: 2000
    max: 60000
    client: true
  relay_rooms_cache_seconds:
    default: 10
    min: 0
    max: 300
    client: false
